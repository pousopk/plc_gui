# Example config for the TCP_Socket_Data UDT (see conversation for the
# TIA Portal struct source). Layout computed from S7 struct alignment
# rules (byte-sized members pack freely; word/dword-sized members need an
# even byte offset), cross-checked against the Header_Padding/Data_Padding
# fields the PLC program already places for exactly that reason:
#
#   frame_counter          UInt   @ 0
#   conditions_length      UInt   @ 2
#   measurements_length    UInt   @ 4
#   (Header_Padding        Word   @ 6   -- not exposed, reserved)
#   global_result          USInt  @ 8
#   (Data_Padding          Byte   @ 9   -- not exposed, reserved)
#   class_classification    UInt   @ 10
#   class_detection          UInt   @ 12
#   detection_appearances   UInt   @ 14
#   condition_1..20         USInt  @ 16..35   (1 byte each)
#   measure_1..20           Real   @ 36..112  (4 bytes each)
#   Socket_Configuration (TCON_IP_v4) @ 116   -- NOT exposed: PLC-internal
#     TCP connection descriptor used by the TCON instruction, not process
#     data. Its exact byte layout isn't modeled here.
#
# TODO before use:
#   - db: 100 is a PLACEHOLDER. Replace with the real DB number.
#   - This models ONE instance. If multiple instances are packed
#     back-to-back in the same DB, each instance N>0 needs every offset
#     above shifted by N * stride, where stride = 116 + sizeof(TCON_IP_v4)
#     (rounded to the DB's actual per-instance size) — ask for that size
#     once you have it, rather than guessing TCON_IP_v4's exact layout.
#   - Condition_1..20 are USInt (0-255), not Bool, so they're rendered as
#     text_display here rather than led_indicator (which only lights up
#     for a true Bool tag). If these are really 0/1 flags in practice,
#     say so and led_indicator can be extended to treat "nonzero" as on.

