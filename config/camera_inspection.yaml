# One panel per device. Inputs/Outputs are nested groups (collapsible
# sub-sections) inside that single panel, not separate top-level windows.
# Duplicate this whole panel block per additional camera, with its own
# title and its own cam2_/cam3_/... tag ids.
panels:
  - title: "Camera 1"
    layout: vertical
    groups:
      - title: "Inputs"
        widgets:
          - type: toggle
            tag: cam1_in
            label: "In"
          - type: button
            tag: cam1_reset
            label: "Reset"
          - type: button
            tag: cam1_trigger_software
            label: "Trigger Software"
          - type: input_number
            tag: cam1_timeout
            label: "Timeout (ms)"
      - title: "Outputs"
        widgets:
          - type: led_indicator
            tag: cam1_finished
            label: "Finished"
          - type: led_indicator
            tag: cam1_ok
            label: "Ok"
          - type: led_indicator
            tag: cam1_nok
            label: "NOk"
          - type: led_indicator
            tag: cam1_trigger_cam
            label: "Trigger Cam"
          - type: led_indicator
            tag: cam1_timeout_error
            label: "Timeout Error"
          - type: led_indicator
            tag: cam1_ready
            label: "Ready"
          - type: led_indicator
            tag: cam1_busy
            label: "Busy"
          - type: led_indicator
            tag: cam1_reset_ack
            label: "Reset Ack"
  - title: "Camera 2"
    layout: vertical
    groups:
      - title: "Inputs"
        widgets:
          - type: toggle
            tag: cam2_in
            label: "In"
          - type: button
            tag: cam2_reset
            label: "Reset"
          - type: button
            tag: cam2_trigger_software
            label: "Trigger Software"
          - type: input_number
            tag: cam2_timeout
            label: "Timeout (ms)"
      - title: "Outputs"
        widgets:
          - type: led_indicator
            tag: cam2_finished
            label: "Finished"
          - type: led_indicator
            tag: cam2_ok
            label: "Ok"
          - type: led_indicator
            tag: cam2_nok
            label: "NOk"
          - type: led_indicator
            tag: cam2_trigger_cam
            label: "Trigger Cam"
          - type: led_indicator
            tag: cam2_timeout_error
            label: "Timeout Error"
          - type: led_indicator
            tag: cam2_ready
            label: "Ready"
          - type: led_indicator
            tag: cam2_busy
            label: "Busy"
          - type: led_indicator
            tag: cam2_reset_ack
            label: "Reset Ack"

logging:
  sinks:
    - id: csv_main
      type: csv
      path: "logs/camera_inspection.csv"
    - id: sqlite_main
      type: sqlite
      path: "logs/camera_inspection.db"
      table: "camera_inspection"
    # Delete this sink (and its id from rules.sinks below) if you don't
    # want local CSV/SQLite logging alongside InfluxDB — they're
    # independent, having all three costs nothing but disk space.
    - id: influx_main
      type: influxdb
      url: "http://localhost:8086"
      token: "6-9PzoTOfoUQRBLV8PK2BANsjZTCuoe2ppfNWDVUik3wO5dco1LqOlElAmxfv13GhIsy0fJtRraQdmH0NTRhEQ=="
      org: "logicmelt"
      bucket: "PLC"
      measurement: "camera_inspection" # defaults to "plc_readings" if omitted
  rules:
    - tags:
        - cam1_in
        - cam1_reset
        - cam1_trigger_software
        - cam1_timeout
        - cam1_finished
        - cam1_ok
        - cam1_nok
        - cam1_trigger_cam
        - cam1_timeout_error
        - cam1_ready
        - cam1_busy
        - cam1_reset_ack
        - cam2_in
        - cam2_reset
        - cam2_trigger_software
        - cam2_timeout
        - cam2_finished
        - cam2_ok
        - cam2_nok
        - cam2_trigger_cam
        - cam2_timeout_error
        - cam2_ready
        - cam2_busy
        - cam2_reset_ack
      interval_ms: 1000
      sinks: [csv_main, sqlite_main, influx_main]
