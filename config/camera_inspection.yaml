# DRAFT — do not deploy as-is. Still waiting on one confirmation from TIA Portal:
#
#   Every CAMERA_INSPECTION instance DB (DB1 for Camera 1, DB3 for Camera 2)
#   must have "Optimized block access" unchecked. Optimized blocks have no
#   fixed byte offsets — Snap7 cannot read them at all. If a DB is still
#   optimized, the app will either fail to connect/read, or (if some other
#   DB happens to occupy that number) silently read the wrong memory.
#
#   Offsets below are the REFERENCE layout for standard (non-optimized)
#   access, computed from S7 struct-packing rules: consecutive Bools pack
#   bit-by-bit into one byte until a non-bool field forces the byte
#   closed; Time (a 4-byte signed millisecond count) needs even byte
#   alignment. Confirm these against the real "Offset" column TIA Portal
#   shows once optimized access is off — don't trust this blindly.
#
#      In               Bool   0.0
#      Reset            Bool   0.1
#      TriggerSoftware  Bool   0.2
#      Timeout          Time   2   (4 bytes)
#      Finished         Bool   6.0
#      Ok               Bool   6.1
#      NOk              Bool   6.2
#      TriggerCam       Bool   6.3
#      TimeOutError     Bool   6.4
#      Ready            Bool   6.5
#      Busy             Bool   6.6
#      ResetAck         Bool   6.7
#
# --------------------------------------------------------------------------
# HOW TO ADD ANOTHER CAMERA (or a third, fourth, ...):
#
#   The camera_inspection device_type below is defined ONCE. Adding a new
#   camera is just a new entry under devices: — 4 lines, no offsets, no
#   copy-pasted tags/panels/logging blocks:
#
#     - type: camera_inspection
#       id: cam3
#       db: <its real DB number>
#       label: "Camera 3"
#
#   That's it. The loader expands it into the full set of tags, a panel
#   with Inputs/Outputs sections, and (once added to the logging rule's
#   devices: list below) full CSV/SQLite/InfluxDB logging — automatically.
#   `id` must be unique across all devices; the loader rejects a repeat.
# --------------------------------------------------------------------------

plc:
  name: "PLC 1"
  ip: "192.168.1.160"
  rack: 0
  slot: 1
  connect_timeout_ms: 2000
  reconnect_backoff_ms: [500, 1000, 2000, 5000]

device_types:
  camera_inspection:
    update_interval_ms: 200
    fields:
      # VAR_INPUT — writable. In is a held enable/level signal (toggle);
      # Reset and TriggerSoftware are pulse-triggered per their names
      # (momentary buttons — write once per click); Timeout is a plain
      # numeric input in milliseconds.
      - { id: in, type: bool, offset: 0, bit: 0, label: "In", writable: true, widget: toggle, group: "Inputs" }
      - { id: reset, type: bool, offset: 0, bit: 1, label: "Reset", writable: true, widget: toggle, group: "Inputs" }
      - { id: trigger_software, type: bool, offset: 0, bit: 2, label: "Trigger Software", writable: true, widget: toggle, group: "Inputs" }
      - { id: timeout, type: time, offset: 2, label: "Timeout (ms)", writable: true, widget: input_number, group: "Inputs" }
      # VAR_OUTPUT — read-only monitoring; the PLC drives these.
      - { id: finished, type: bool, offset: 6, bit: 0, label: "Finished", widget: led_indicator, group: "Outputs" }
      - { id: ok, type: bool, offset: 6, bit: 1, label: "Ok", widget: led_indicator, group: "Outputs" }
      - { id: nok, type: bool, offset: 6, bit: 2, label: "NOk", widget: led_indicator, group: "Outputs" }
      - { id: trigger_cam, type: bool, offset: 6, bit: 3, label: "Trigger Cam", widget: led_indicator, group: "Outputs" }
      - { id: timeout_error, type: bool, offset: 6, bit: 4, label: "Timeout Error", widget: led_indicator, group: "Outputs" }
      - { id: ready, type: bool, offset: 6, bit: 5, label: "Ready", widget: led_indicator, group: "Outputs" }
      - { id: busy, type: bool, offset: 6, bit: 6, label: "Busy", widget: led_indicator, group: "Outputs" }
      - { id: reset_ack, type: bool, offset: 6, bit: 7, label: "Reset Ack", widget: led_indicator, group: "Outputs" }

devices:
  - type: camera_inspection
    id: cam1
    db: 1
    label: "Camera 1"

logging:
  sinks:
    - id: csv_main
      type: csv
      path: "logs/camera_inspection.csv"
    - id: sqlite_main
      type: sqlite
      path: "logs/camera_inspection.db"
      table: "camera_inspection"
    # Delete this sink (and its id from rules.sinks below) if you don't
    # want local CSV/SQLite logging alongside InfluxDB — they're
    # independent, having all three costs nothing but disk space.
    - id: influx_main
      type: influxdb
      url: "http://localhost:8086"
      token: "6-9PzoTOfoUQRBLV8PK2BANsjZTCuoe2ppfNWDVUik3wO5dco1LqOlElAmxfv13GhIsy0fJtRraQdmH0NTRhEQ=="
      org: "logicmelt"
      bucket: "PLC"
      measurement: "camera_inspection" # defaults to "plc_readings" if omitted
  rules:
    # Add a new camera's id here too, once it exists — every one of its
    # fields gets logged automatically, no need to list them individually.
    - devices: [cam1]
      interval_ms: 1000
      sinks: [csv_main, sqlite_main, influx_main]
