# DRAFT — do not deploy as-is. Still waiting on one confirmation from TIA Portal:
#
#   Every CAMERA_INSPECTION instance DB (DB1 for Camera 1, DB3 for Camera 2)
#   must have "Optimized block access" unchecked. Optimized blocks have no
#   fixed byte offsets — Snap7 cannot read them at all. If a DB is still
#   optimized, the app will either fail to connect/read, or (if some other
#   DB happens to occupy that number) silently read the wrong memory.
#
#   Offsets below are the REFERENCE layout for standard (non-optimized)
#   access, computed from S7 struct-packing rules: consecutive Bools pack
#   bit-by-bit into one byte until a non-bool field forces the byte
#   closed; Time (a 4-byte signed millisecond count) needs even byte
#   alignment. Confirm these against the real "Offset" column TIA Portal
#   shows once optimized access is off — don't trust this blindly.
#
#      In               Bool   0.0
#      Reset            Bool   0.1
#      TriggerSoftware  Bool   0.2
#      Timeout          Time   2   (4 bytes)
#      Finished         Bool   6.0
#      Ok               Bool   6.1
#      NOk              Bool   6.2
#      TriggerCam       Bool   6.3
#      TimeOutError     Bool   6.4
#      Ready            Bool   6.5
#      Busy             Bool   6.6
#      ResetAck         Bool   6.7
#
#   VAR_INPUT (In, Reset, TriggerSoftware, Timeout) are writable: In is a
#   toggle (assumed to be a held enable/level signal), Reset and
#   TriggerSoftware are momentary buttons (assumed pulse-triggered, per
#   their names — writes `true` once per click), Timeout is a numeric
#   input in milliseconds. VAR_OUTPUT fields are read-only monitoring
#   (led_indicator/text_display) — the PLC drives these, so nothing here
#   writes to them.
#
#   Camera 2 (DB3) is wired up the same way as Camera 1 (DB1) — same
#   offsets, same widget layout, distinct cam2_ tag ids. For a Camera 3,
#   duplicate the same pattern again with cam3_ ids and its real DB number.
#   Every tag also carries a `device` (e.g. "Camera 1"/"Camera 2"), emitted
#   by InfluxLogSink as a real Influx tag — without it, both cameras'
#   identically-labeled signals (e.g. "Finished") would land in the same
#   Influx series and become indistinguishable in Grafana.

